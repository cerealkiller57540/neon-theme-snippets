# Sidebar code rain: paste into YOUR theme, under the card-mod-sidebar key.
# If your theme already has a card-mod-sidebar block, append the CSS below to it
# (and drop any existing .wrapper::before / ::after rules, they would clash).
#
# my-theme:
#   ...your theme variables...
  card-mod-sidebar: |
    /* Code rain below the LAST panel of the sidebar.
       .wrapper is a flex column holding only the panel list, so ::after becomes a flex item
       (flex:1, order:99) that takes exactly the free space under the list: it follows panels
       being added or removed, nothing to recalibrate.
       Mask with 3 layers: [fade] ∩ ([front] ∪ [back]). Layer opacity is baked into the SVGs.
       The fall itself is animated INSIDE the SVGs (SMIL). Here: hue drift + a rare glitch. */
    @keyframes sb-drift {
      from { background: hsl(265 100% 70%); }
      to   { background: hsl(190 100% 70%); }
    }
    @keyframes sb-glitch {
      0%, 96%   { transform: none; filter: none; }
      96.5%     { transform: translateX(4px) skewX(-6deg); filter: brightness(2.2); }
      97%       { transform: translateX(-3px); filter: brightness(.4); }
      97.5%     { transform: translateX(2px) skewX(3deg); filter: brightness(1.8); }
      98%, 100% { transform: none; filter: none; }
    }
    .wrapper {
      position: relative;
      isolation: isolate;
    }
    .wrapper::after {
      content: "";
      flex: 1 1 0;
      min-height: 0;
      order: 99;
      pointer-events: none;
      background: hsl(265 100% 70%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 50px, #000 calc(100% - 80px), transparent), url('/local/sidebar-rain-near.svg?v=1'), url('/local/sidebar-rain-far.svg?v=1');
              mask-image: linear-gradient(180deg, transparent 0, #000 50px, #000 calc(100% - 80px), transparent), url('/local/sidebar-rain-near.svg?v=1'), url('/local/sidebar-rain-far.svg?v=1');
      -webkit-mask-repeat: no-repeat, repeat-y, repeat-y;           mask-repeat: no-repeat, repeat-y, repeat-y;
      -webkit-mask-size: 100% 100%, 240px 720px, 156px 468px;       mask-size: 100% 100%, 240px 720px, 156px 468px;
      -webkit-mask-position: 0 0, center 0, 37% 0;                 mask-position: 0 0, center 0, 37% 0;
      -webkit-mask-composite: source-in, source-over, source-over;  mask-composite: intersect, add, add;
      animation: sb-drift 20s ease-in-out infinite alternate, sb-glitch 23s step-end infinite;
    }
    /* Phones, touch tablets and reduced motion: a still image, front layer only. */
    @media (max-width: 767px), (hover: none) and (pointer: coarse), (prefers-reduced-motion: reduce) {
      .wrapper::after {
        animation: none;
        -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 50px, #000 calc(100% - 80px), transparent), url('/local/sidebar-rain-static.svg?v=1');
                mask-image: linear-gradient(180deg, transparent 0, #000 50px, #000 calc(100% - 80px), transparent), url('/local/sidebar-rain-static.svg?v=1');
        -webkit-mask-repeat: no-repeat, repeat-y;                    mask-repeat: no-repeat, repeat-y;
        -webkit-mask-size: 100% 100%, 240px 720px;                   mask-size: 100% 100%, 240px 720px;
        -webkit-mask-position: 0 0, center 0;                        mask-position: 0 0, center 0;
        -webkit-mask-composite: source-in;                           mask-composite: intersect;
        opacity: .35;
      }
    }
